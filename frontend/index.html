<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Price-prediction</title>
</head>
<body>
    <div class="container">
        <h2>Предсказание стоимости квартиры</h2>

        <label for="rooms">Город</label>
        <select name="rooms" id="rooms">
            <option value="center">Москва</option>
            <option value="north">Санкт-Петербург</option>
        </select>
        <br>

        <label for="rooms">Площадь квартиры(метры)</label>
        <input type="number" id="metres" min="0">
        <br>

        <label for="rooms">Количество комнат</label>
        <select name="rooms" id="rooms">
            <option value="center">1</option>
            <option value="north">2</option>
            <option value="south">3</option>
            <option value="east">4</option>
            <option value="west">5</option>
        </select>
        <br>

        <label for="floors">Этаж</label>
        <input type="number" id="floors" min="1">
        <br>

        <label for="metres_underground">Ближайшее метро(метры)</label>
        <input type="number" id="metres_underground" min="1">
        <br>
        



    </div>

    <script src="script.js"></script>
</body>
</html>
