<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Price-prediction</title>
</head>
<body>
    <div class="container">
        <h2>Предсказание стоимости квартиры</h2>

        <label for="city">Город</label>
        <select id="city" required>
            <option value="" disabled selected>Выберите город</option>
            <option value="Moscow">Москва</option>
            <option value="Saint-Petersburg">Санкт-Петербург</option>
        </select>
        <br>

        <label for="metres">Площадь квартиры</label>
        <input type="number" id="metres" placeholder="м2">
        <br>

        <label for="rooms">Количество комнат</label>
        <select name="rooms" id="rooms">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
        </select>
        <br>

        <label for="floors">Этаж</label>
        
        <input type="number" id="floors" max="80">
        
        <br>

        <label for="metres_underground">Ближайшее метро</label>
        <input type="number" id="metres_underground" placeholder="минуты">
        <br>

        <label for="build_year">Год постройки</label>
        <input type="number" id="build_year">
        <br>

        <span id="er">Неверные данные</span>
        <button id="count_result">Рассчитать</button>


    </div>

    <script src="script.js"></script>
</body>
</html>
