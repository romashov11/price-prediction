<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Price-prediction</title>
</head>
<body>
    <div class="container">
        <h2>Предсказание стоимости квартиры</h2>

        <label for="city">Город</label>
        <select name="city" id="city">
            <option value="Moscow">Москва</option>
            <option value="Saint-Petersburg">Санкт-Петербург</option>
        </select>
        <br>

        <label for="metres">Площадь квартиры</label>
        <input type="number" id="metres" min="0">
        <br>

        <label for="rooms">Количество комнат</label>
        <select name="rooms" id="rooms">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
        <br>

        <label for="floors">Этаж</label>
        <input type="number" id="floors" min="1">
        <br>

        <label for="metres_underground">Ближайшее метро(минуты)</label>
        <input type="number" id="metres_underground" min="1">
        <br>
        
        <button id="count_result">Рассчитать</button>


    </div>

    <script src="script.js"></script>
</body>
</html>
